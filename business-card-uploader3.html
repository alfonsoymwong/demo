<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Business Card Application Form Filling (v2.0)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ================= THEME: DEFAULT (DARK) ================= */
    :root{
      --brand:#00a8ff; --brand-2:#7c3aed; --accent:#22d3ee;
      --muted:#9CA3AF; --ok:#10B981; --err:#EF4444;

      --bg:#0b1020;
      --bg-grad-1: radial-gradient(1000px 600px at 10% -10%, rgba(124,58,237,.20), transparent 60%);
      --bg-grad-2: radial-gradient(1000px 600px at 100% 0%, rgba(34,211,238,.15), transparent 60%);
      --bg-grad-3: radial-gradient(900px 500px at 100% 100%, rgba(0,168,255,.10), transparent 60%);
      --card:rgba(255,255,255,.08);
      --glass:rgba(255,255,255,.06);
      --border:rgba(255,255,255,.12);
      --text:#E5E7EB; --text-strong:#ffffff; --text-dim:#C7D2FE;

      --input-bg:rgba(255,255,255,.05); --input-border:rgba(255,255,255,.22);
      --input-focus-ring:rgba(34,211,238,.25); --panel-shadow: 0 10px 30px rgba(0,0,0,.25);

      --pa:#ef4444; --pa-weak: rgba(239,68,68,.18);
      --dify:#7c3aed; --dify-weak: rgba(124,58,237,.16);
      --total:#22d3ee; --total-weak: rgba(34,211,238,.16);
      --step-done:#10b981; --step-active:#22d3ee;

      --btn-primary-from:#22d3ee; --btn-primary-to:#00a8ff; --btn-primary-text:#06202a;

      /* PA suggestion visuals */
      --pa-sg-bg: linear-gradient(135deg, rgba(239,68,68,.14), rgba(239,68,68,.08));
      --pa-sg-stripe: repeating-linear-gradient(135deg, rgba(239,68,68,.22) 0 8px, rgba(239,68,68,.10) 8px 16px);
      --pa-sg-border: rgba(239,68,68,.55);
      --pa-sg-text: #ffecec;

      --applied-dim: .42; /* if you later enable dimming after copy */
    }

    /* ================= THEME: LIGHT OVERRIDES ================= */
    [data-theme="light"]{
      --bg:#f6f8ff;
      --bg-grad-1: radial-gradient(1000px 600px at 5% -10%, rgba(124,58,237,.12), transparent 60%);
      --bg-grad-2: radial-gradient(1000px 600px at 100% 0%, rgba(34,211,238,.12), transparent 60%);
      --bg-grad-3: radial-gradient(900px 500px at 100% 100%, rgba(0,168,255,.08), transparent 60%);
      --card:#ffffffcc; --glass:#ffffffd9; --border:rgba(17,24,39,.12);
      --text:#0f172a; --text-strong:#0b1020; --text-dim:#374151;
      --input-bg:#ffffff; --input-border:rgba(17,24,39,.22);
      --input-focus-ring:rgba(34,211,238,.35); --panel-shadow: 0 10px 30px rgba(2,6,23,.10);

      --pa-weak: rgba(239,68,68,.10);
      --dify-weak: rgba(124,58,237,.08);
      --total-weak: rgba(34,211,238,.10);

      --pa-sg-bg: linear-gradient(135deg, #ffe7e7, #ffecec);
      --pa-sg-stripe: repeating-linear-gradient(135deg, rgba(239,68,68,.14) 0 8px, rgba(239,68,68,.06) 8px 16px);
      --pa-sg-text: #751a1a;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
      background: var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg);
    }

    /* ======= TOP PROGRESS BAR ======= */
    .top-progress{ position: fixed; inset: 0 0 auto 0; height: 12px; z-index: 10001; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .top-progress[aria-hidden="false"]{ opacity: 1; pointer-events: auto; }
    .top-progress__track{ position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border-bottom: 1px solid var(--border); backdrop-filter: blur(4px); box-shadow: 0 6px 18px rgba(0,0,0,.25); overflow: hidden; }
    .top-progress__fill{
      position: absolute; left: 0; top: 0; height: 100%; width: 0%; transition: width .25s linear;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 8px, rgba(255,255,255,0) 8px 16px),
        linear-gradient(90deg, var(--brand), var(--accent), var(--dify));
      background-size: 16px 16px, 200% 100%;
      animation: tp-move 1.2s linear infinite reverse, tp-breath 1.8s ease-in-out infinite;
      box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(124,58,237,.25) inset;
      border-right: 1px solid rgba(255,255,255,.35);
    }
    @keyframes tp-move { from{ background-position: 0 0, 0 0 } to{ background-position: 16px 0, 200% 0 } }
    @keyframes tp-breath { 0%,100%{ filter: brightness(1) } 50%{ filter: brightness(1.2) } }
    .top-progress__spark{ position: absolute; top: 0; left: 0; width: 26px; height: 100%; transform: translateX(-50%); background: radial-gradient(16px 10px at 50% 50%, #fff, rgba(255,255,255,0)); mix-blend-mode: screen; opacity: .85; pointer-events: none; }
    .top-progress__hud{ position: absolute; top: 16px; right: 10px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(8px); font-size: .82rem; font-weight: 700; color: var(--text); box-shadow: var(--panel-shadow); }
    .tp__stage{ color: var(--text-strong); } .tp__sep{ opacity: .6 } .tp__pct{ color: var(--text-dim) }
    .tp__cancel{ margin-left: 2px; border: 0; cursor: pointer; background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; padding: 4px 8px; border-radius: 999px; font-weight: 800; line-height: 1; box-shadow: 0 6px 16px rgba(239,68,68,.35); }
    .tp__cancel:hover{ filter: brightness(1.1) }

    /* ======= LAYOUT ======= */
    .wrap{max-width:1280px;margin:28px auto;padding:0 18px}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{font-size:1.35rem;letter-spacing:.2px;margin:0;font-weight:700;color:var(--text-strong);display:flex;align-items:center;gap:10px}
    h1 .glow-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--brand));box-shadow:0 0 16px var(--accent)}
    .subtitle{color:var(--text-dim);font-size:.95rem;margin:4px 0 18px}

    .theme-toggle{ display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--border); border-radius:999px;padding:8px 12px;cursor:pointer;color:var(--text); backdrop-filter:blur(8px);box-shadow:var(--panel-shadow) }
    .theme-toggle .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:.88rem;font-weight:700}
    .theme-toggle .chip--on{background:linear-gradient(135deg,var(--brand),var(--accent));color:#0b1020}
    .theme-toggle .chip--off{opacity:.8}

    .layout{display:grid;gap:16px;grid-template-columns:1fr}
    .panel{ background:var(--card);border:1px solid var(--border);border-radius:16px; padding:16px 16px 14px;backdrop-filter:blur(8px); box-shadow:var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,.04) }
    .panel h2{font-size:1rem;margin:0 0 12px;display:flex;align-items:center;gap:10px;color:var(--text-strong);font-weight:700}
    .panel h2 .bar{width:6px;height:18px;border-radius:4px;background:linear-gradient(180deg,var(--brand),var(--accent));box-shadow:0 0 10px var(--accent)}
    .stack{display:flex;flex-direction:column;gap:16px}

    /* ======= FORMS ======= */
    .row-2col{display:grid;grid-template-columns:1fr 360px;gap:12px}
    @media (max-width:819px){.row-2col{grid-template-columns:1fr}}
    .form-grid{display:grid;gap:12px;grid-template-columns:1fr}
    @media (min-width:840px){.form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}} /* 3-up compact */
    @media (min-width:1200px){.form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

    .field{display:flex;flex-direction:column;gap:8px}
    .field label{color:var(--text);font-size:.86rem;opacity:.95;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .label-badges{display:inline-flex;gap:6px;align-items:center}
    .badge-pa{
      display:inline-flex;align-items:center;gap:6px;font-size:.72rem;line-height:1;
      padding:4px 8px;border-radius:999px;color:#fff;background:var(--pa);
      box-shadow:0 0 10px rgba(239,68,68,.45) inset, 0 0 10px rgba(239,68,68,.25)
    }
    .badge{
      display:inline-flex;align-items:center;gap:6px;font-size:.72rem;line-height:1;
      padding:4px 8px;border-radius:999px;background:var(--dify-weak); color:#0b1020;
      border:1px solid rgba(124,58,237,.35)
    }

    /* Inputs (make clearly editable) */
    input[type="text"],input[type="email"],textarea{
      width:100%;padding:10px 12px;border:1px solid var(--input-border);border-radius:12px;
      font-size:.96rem;color:var(--text-strong);background:var(--input-bg);
      outline:none;transition:border-color .2s, box-shadow .2s, background-color .2s; box-shadow:0 0 0 2px transparent inset;
    }
    input::placeholder,textarea::placeholder{color:rgba(127,127,127,.55)}
    input:focus,textarea:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 2px var(--input-focus-ring) inset, 0 0 12px rgba(34,211,238,.15);background:rgba(255,255,255,.08)}
    [data-theme="light"] input:focus,[data-theme="light"] textarea:focus{ background:#ffffff }
    textarea{min-height:86px;resize:vertical}

    /* Applied feedback on inputs (temporary glow) */
    .just-filled{ animation: filledFlash 1200ms ease-out 1; }
    @keyframes filledFlash{
      0%{ box-shadow:0 0 0 0 rgba(16,185,129,.0), 0 0 0 0 rgba(16,185,129,.0); }
      30%{ box-shadow:0 0 0 2px rgba(16,185,129,.55) inset, 0 0 18px rgba(16,185,129,.25); }
      100%{ box-shadow:0 0 0 0 rgba(16,185,129,.0), 0 0 0 0 rgba(16,185,129,.0); }
    }

    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{
      background:linear-gradient(135deg,var(--brand),var(--accent));color:var(--btn-primary-text);border:0;border-radius:12px;
      padding:10px 14px;font-size:.96rem;font-weight:700;cursor:pointer;letter-spacing:.2px
    }
    button:hover{filter:brightness(1.1)} button:disabled{opacity:.55;cursor:not-allowed}
    .btn-ghost{ background:transparent;color:var(--text);border:1px solid var(--border); border-radius:8px;padding:6px 10px;font-size:.86rem;cursor:pointer }
    .btn-ghost:hover{filter:brightness(1.2)}
    .btn-danger{ background:linear-gradient(135deg, #ef44441a, #ef44440f); border:1px solid rgba(239,68,68,.45) }

    .status{font-size:.92rem}
    .ok{color:var(--ok)} .err{color:var(--err)}
    .hint{font-size:.9rem;color:var(--muted)}

    .preview{
      width:100%;max-width:340px;max-height:200px;border:1px dashed var(--border);
      border-radius:12px;display:block;object-fit:contain;cursor:zoom-in;background:rgba(255,255,255,.03)
    }
    [data-theme="light"] .preview{ background:#fff }

    /* ======= STEPPER / TIMINGS ======= */
    .stepper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .step{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:.86rem}
    .step--active{box-shadow:0 0 0 2px var(--step-active) inset}
    .step--done{box-shadow:0 0 0 2px var(--step-done) inset; opacity:.9}
    .chip-spinner { width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color: var(--accent);animation: spin .8s linear infinite;display:none; }
    .step--active .chip-spinner { display:inline-block; }
    @keyframes spin{to{transform:rotate(360deg)}}
    .timing-panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .chip-time{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:.86rem;color:#0b1020}
    .chip-time .dot{width:8px;height:8px;border-radius:50%}
    .chip-pa{background:var(--pa-weak);outline:1px solid rgba(239,68,68,.35)} .chip-pa .dot{background:var(--pa)}
    .chip-dify{background:var(--dify-weak);outline:1px solid rgba(124,58,237,.35)} .chip-dify .dot{background:var(--dify)}
    .chip-total{background:var(--total-weak);outline:1px solid rgba(34,211,238,.35)} .chip-total .dot{background:var(--total)}

    /* ======= INLINE LAYOUT: make input wider and suggestion narrower ======= */
    .pair{
      display:grid;
      grid-template-columns: 1fr minmax(120px, 180px); /* input grows; PA is narrow */
      gap:8px; align-items:stretch;
    }
    @media (max-width:560px){ .pair{ grid-template-columns:1fr; } }

    /* ======= PA READ-ONLY SUGGESTION ======= */
    .pa-pill, .pa-box{
      position:relative; border:1px dashed var(--pa-sg-border);
      background: var(--pa-sg-stripe), var(--pa-sg-bg);
      color:var(--pa-sg-text);
      border-radius:12px; cursor:pointer;
      transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
      outline: none;
    }
    .pa-pill{ display:flex; align-items:center; gap:8px; padding:10px 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:44px; }
    .pa-box{ display:block; padding:12px; min-height:72px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }

    .pa-pill:not([aria-disabled="true"]):hover, .pa-box:not([aria-disabled="true"]):hover{
      filter:brightness(1.08); box-shadow:0 8px 22px rgba(239,68,68,.12);
    }
    .pa-pill:not([aria-disabled="true"]):active, .pa-box:not([aria-disabled="true"]):active{ transform: translateY(1px); }
    .pa-pill[aria-disabled="true"], .pa-box[aria-disabled="true"]{ cursor:default; }
